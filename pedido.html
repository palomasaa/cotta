<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faça seu pedido</title>
<meta name="description" content="Monte seu menu, veja as datas livres e faça seu pedido online.">
<meta name="theme-color" content="#f6f3ee">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
:root{--bg:#f6f3ee;--surface:#fff;--surface-2:#f1ede6;--line:#e4ddd2;--line-2:#d3c9b9;--ink:#1d1a16;--ink-2:#3b352d;--muted:#6f675c;--accent:#7a4b22;--accent-ink:#fff;--accent-soft:#f3e9de;--pos:#2f6b45;--pos-bg:#e5f0e8;--neg:#a2302a;--neg-bg:#f7e7e5;--wa:#1f8f4e;--r:14px;--f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--d:"Cormorant Garamond",Georgia,serif}
:root[data-e="loja"]{--bg:#f4f5f7;--surface-2:#eef0f3;--line:#e1e4ea;--line-2:#cfd4dd;--ink:#14181f;--ink-2:#323946;--muted:#636b78;--accent:#2f4a6b;--accent-soft:#e7edf4;--d:"Geist",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--surface:#1a1917;--surface-2:#221f1c;--line:#2d2a26;--line-2:#3c3832;--ink:#efebe4;--ink-2:#d2ccc2;--muted:#a19a8f;--accent:#d7a36d;--accent-ink:#1d140b;--accent-soft:#2c2219;--pos:#86cfa3;--pos-bg:#14271c;--neg:#f08b81;--neg-bg:#2f1715;color-scheme:dark}
  :root[data-e="loja"]:not([data-theme="light"]){--bg:#0f1114;--surface:#171a1f;--surface-2:#1d2128;--line:#272c34;--line-2:#353b45;--accent:#9db6d6;--accent-ink:#0c1420;--accent-soft:#1a2330}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{padding:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mk{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:650;letter-spacing:-.02em;flex:0 0 auto}
.brand b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.brand span{font-size:13px;color:var(--muted)}
.hero{padding:26px 0 18px}
.hero h1{font-family:var(--d);font-weight:600;font-size:clamp(34px,6vw,54px);line-height:1.04;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
:root[data-e="loja"] .hero h1{font-weight:650;letter-spacing:-.03em;font-size:clamp(28px,5vw,42px)}
.hero p{margin:0;color:var(--muted);max-width:620px;font-size:16px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.steps li{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.steps b{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px 16px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;padding-bottom:110px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
section.card>h2{font-size:17px;margin:0 0 4px;font-weight:600;display:flex;align-items:center;gap:10px}
section.card>h2 .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.menus{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.menu{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--bg);text-align:left;display:grid;gap:8px;align-content:start;transition:border-color .15s,box-shadow .15s}
.menu:hover{border-color:var(--line-2)}
.menu[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset;background:var(--surface)}
.menu h3{font-family:var(--d);font-size:22px;font-weight:600;margin:0;line-height:1.1}
:root[data-e="loja"] .menu h3{font-size:16px}
.menu .oc{font-size:12.5px;color:var(--muted)}
.menu ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2);display:grid;gap:1px}
.menu .pr{font-weight:600;font-variant-numeric:tabular-nums}
.menu .pr small{font-weight:400;color:var(--muted)}
.counter{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--surface)}
.counter button{width:46px;height:46px;border:0;background:transparent;font-size:22px;color:var(--ink)}
.counter output{min-width:64px;text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cal{display:grid;gap:10px}
.calhd{display:flex;align-items:center;justify-content:space-between}
.calhd b{font-size:15px}
.calhd button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid7 .wd{font-size:11.5px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.day{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-weight:500;display:grid;place-items:center;position:relative;padding:0}
.day:disabled{background:transparent;border-color:transparent;color:var(--muted);opacity:.45;cursor:not-allowed}
.day.busy:disabled{text-decoration:line-through;opacity:.6}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.f{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.field input,.field textarea,.field select{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:80px;resize:vertical}
aside.sum{position:sticky;top:16px}
.sum .card{margin:0}
.rows{display:grid;gap:8px;font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:10px}
.rows span{color:var(--muted)}
.rows b{text-align:right;font-weight:500}
.tot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.msg{font-size:14px;min-height:1.2em;margin:8px 0 0}
.msg.err{color:var(--neg)}
.bar{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 10px 30px rgb(0 0 0 / .18);border-radius:999px;padding:12px 18px}
.ok{text-align:center;max-width:560px;margin:30px auto 120px}
.ok .ic{width:64px;height:64px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:grid;place-items:center;margin:0 auto 12px;font-size:30px}
.ok h2{font-family:var(--d);font-size:34px;margin:0 0 8px;font-weight:600}
.pix{display:grid;gap:10px;justify-items:center;margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pix svg{width:200px;height:200px}
.pix code{font-size:12px;word-break:break-all;background:var(--surface-2);padding:8px 10px;border-radius:8px;display:block;max-width:100%}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.prod{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px;align-content:start}
.prod b{font-size:14.5px;font-weight:550;line-height:1.3}
.prod .pr{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.prod .links{display:flex;gap:6px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface)}
.search{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;background:var(--surface);margin-bottom:14px;font-size:16px}
.skel{height:120px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0 30px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside.sum{display:none}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:10px}
  .bar b{font-size:19px;font-variant-numeric:tabular-nums}
  .bar span{display:block;font-size:12px;color:var(--muted)}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:480px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><header class="top"><div class="brand"><span class="mk">…</span><div><b>Carregando…</b></div></div></header><div class="skel" style="margin-top:20px"></div></div>
<style>
.tipos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tipo{border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--bg);text-align:left;display:grid;gap:6px;align-content:start}
.tipo[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset;background:var(--surface)}
.tipo b{font-size:15.5px}
.tipo span{font-size:13.5px;color:var(--muted)}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dish b{font-weight:550;font-size:14.5px}
.dish .sub{font-size:12.5px;color:var(--muted)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 2px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.check input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.timeline{font-size:13px;color:var(--muted);margin:8px 0 0}
@media (max-width:700px){.tipos{grid-template-columns:1fr}}
</style>

<script>
(function(){
"use strict";
const API="https://firestore.googleapis.com/v1/projects/jay-loma/databases/(default)/documents";
const KEY="AIzaSyCz9xPjJc2gASfN9hwsqyaQcdJOYXH1xNs";
const O=window.CotaOrc;
const qs=new URLSearchParams(location.search);
const E=qs.get("e")==="loja"?"loja":"chef";
const ORIGEM=(qs.get("origem")||qs.get("utm_source")||(document.referrer?(()=>{try{return new URL(document.referrer).hostname}catch(_){return ""}})():"direto")||"direto").slice(0,40);
const MENU_INI=qs.get("menu")||"";
document.documentElement.dataset.e=E;
const $=s=>document.querySelector(s);
const brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=c=>brl.format((c||0)/100);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n));};
const fmtD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});};
function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;else e.setAttribute(k,v===true?"":v);}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c instanceof Node?c:document.createTextNode(String(c)));});return e;}
const soDig=t=>String(t||"").replace(/\D/g,"");
const waNum=t=>{let d=soDig(t);if(d&&d.length<=11)d="55"+d;return d;};
const waLink=(num,txt)=>"https://wa.me/"+(num?waNum(num):"")+"?text="+encodeURIComponent(txt);
// ---- Firestore REST: a página só lê catálogo e horários ocupados (sem dados pessoais) e só cria solicitações
const enc=v=>{if(typeof v==="string")return {stringValue:v};if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(typeof v==="boolean")return {booleanValue:v};if(Array.isArray(v))return {arrayValue:{values:v.map(enc)}};if(v==null)return {nullValue:null};return {mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,enc(x)]))}};};
const dec=f=>{if(!f)return null;if("stringValue" in f)return f.stringValue;if("integerValue" in f)return Number(f.integerValue);if("doubleValue" in f)return f.doubleValue;return null;};
async function getPub(){const r=await fetch(API+"/publico/"+E+"?key="+KEY);if(!r.ok)throw new Error("pub");const j=await r.json();return JSON.parse(j.fields.json.stringValue);}
async function getReservas(){const out=[];let tok="";for(let i=0;i<5;i++){const r=await fetch(API+"/reservas?pageSize=300&key="+KEY+(tok?"&pageToken="+tok:""));if(!r.ok)break;const j=await r.json();(j.documents||[]).forEach(d=>{const f=d.fields||{};out.push({id:d.name.split("/").pop(),data:dec(f.data),ini:dec(f.ini)??0,fim:dec(f.fim)??1439});});if(!j.nextPageToken)break;tok=j.nextPageToken;}return out;}
async function criar(col,id,data){const r=await fetch(API+"/"+col+"?documentId="+encodeURIComponent(id)+"&key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:Object.fromEntries(Object.entries(data).map(([k,v])=>[k,enc(v)]))})});if(r.status===409)return "existe";if(!r.ok)throw new Error("salvar "+r.status);return "ok";}
// ---- Pix (BR Code)
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,"0");}
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
const semAc=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 .\-]/g,"").toUpperCase();
function pixChave(p){const t=p.tipo,k=String(p.chave||"").trim();if(t==="telefone"){let d=soDig(k);if(d.length<=11)d="55"+d;return "+"+d;}if(t==="cpf")return soDig(k);if(t==="email")return k.toLowerCase();return k;}
function pixPayload(cfg,v,txid){const mai=tlv("00","br.gov.bcb.pix")+tlv("01",pixChave(cfg));let s=tlv("00","01")+tlv("26",mai)+tlv("52","0000")+tlv("53","986")+(v>0?tlv("54",(v/100).toFixed(2)):"")+tlv("58","BR")+tlv("59",semAc(cfg.nome||"RECEBEDOR").slice(0,25))+tlv("60",semAc(cfg.cidade||"BRASILIA").slice(0,15))+tlv("62",tlv("05",(semAc(txid).replace(/[^A-Z0-9]/g,"")||"***").slice(0,25)));s+="6304";return s+crc16(s);}
function loadQr(){return new Promise((res,rej)=>{if(window.qrcode)return res(window.qrcode);const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";sc.onload=()=>res(window.qrcode);sc.onerror=rej;document.head.append(sc);});}

let P=null,RES=[],C=null;
const st={tipo:"casa",menu:null,pessoas:0,enc:{},data:"",hora:"",mes:"",cart:{},q:""};
const vals={};
const sigla=n=>String(n||"").split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function header(){return h("header",{class:"top"},h("div",{class:"brand"},h("span",{class:"mk",text:P.empresa.sigla||sigla(P.empresa.nome)}),h("div",{},h("b",{text:P.empresa.nome}),h("span",{text:P.empresa.sub||""}))),P.whatsapp?h("a",{class:"btn ghost sm",href:waLink(P.whatsapp,"Olá! Vim pela página de pedidos e queria falar com um consultor."),target:"_blank",rel:"noopener"},"Falar com consultor"):null);}
const fab=()=>P.whatsapp?h("a",{class:"btn wa fab",href:waLink(P.whatsapp,resumoTexto("Olá! Estou montando um pedido e queria tirar uma dúvida.")),target:"_blank",rel:"noopener","aria-label":"Conversar pelo WhatsApp"},"WhatsApp"):null;

// =================== CHEF
const custo=(id,p)=>{const r=P.rec[id];if(!r||!r.c)return 0;const c=r.c;return p<=c.length?c[p-1]:Math.round(c[c.length-1]/c.length*p);};
const TIPOS=[["casa","Chef na sua casa","A chef faz as compras, cozinha na sua casa, serve e deixa a cozinha limpa."],["casa_cliente","Chef na sua casa, você compra","Você recebe a lista de compras exata e paga só o serviço da chef."],["encomenda","Encomenda pronta","Pratos que ficam ótimos reaquecidos, entregues prontos, embalados e etiquetados."]];
function calcAtual(){
  if(st.tipo==="encomenda"){if(!Object.values(st.enc).some(q=>q>0))return null;return O.calcular({tipo:"encomenda",itens:st.enc},P.rec,custo,C);}
  if(!st.menu||!st.pessoas)return null;return O.calcular({tipo:st.tipo,receitas:st.menu.pratos,pessoas:st.pessoas},P.rec,custo,C);
}
function ocupadosDia(d){return RES.filter(r=>r.data===d);}
function horasDia(d,calc){const lista=st.tipo==="encomenda"?C.horariosEntrega:C.horariosCasa;if(!calc)return lista;let L=O.horariosLivres(lista,ocupadosDia(d),calc,C);if(d===today()){const agora=new Date().getHours()*60+new Date().getMinutes();L=L.filter(x=>O.hm(x)+calc.ini>agora+60);}return L;}
function diaLivre(d,calc){
  const t=today();if(d<addDays(t,C.antecedencia||0))return {ok:false,why:"antes"};
  if(d>addDays(t,C.janela||180))return {ok:false,why:"longe"};
  const wd=new Date(d+"T12:00").getDay();if(!C.dias.includes(wd))return {ok:false,why:"fechado"};
  if(C.bloqueios.includes(d))return {ok:false,why:"bloq"};
  if(!horasDia(d,calc).length)return {ok:false,why:"busy"};
  return {ok:true};
}
function calendario(calc){
  if(!st.mes)st.mes=addDays(today(),C.antecedencia||0).slice(0,7);
