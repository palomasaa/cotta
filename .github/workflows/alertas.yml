name: Alertas do dia

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 8h de Brasília
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar um alerta de teste mesmo sem avisos"
        type: boolean
        default: true

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/alertas.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTE: ${{ github.event.inputs.teste }}
