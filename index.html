<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#06120e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COTTA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>COTTA · Gestão societária</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* COTTA · sistema visual v4 — verde-floresta e esmeralda do logo, tipografia geométrica (Montserrat) e texto em Inter. */
:root{
  --bg:#f2f5f3;--surface:#ffffff;--surface-2:#edf2ef;--surface-3:#e1e9e4;--line:#dfe7e2;--line-2:#c8d5cd;
  --ink:#0a241c;--ink-2:#243f37;--muted:#5d7068;--faint:#93a39b;
  --accent:#14513f;--accent-2:#2f8a6b;--accent-ink:#ffffff;--accent-soft:#e2f0e9;--accent-line:#b3d5c4;
  --grad:linear-gradient(135deg,#0a261e 0%,#12493a 52%,#2b8366 100%);
  --side-bg:linear-gradient(180deg,#0a241c 0%,#0c2c23 60%,#0f3329 100%);--side-ink:#d3e3db;--side-muted:#7f9f92;--side-line:rgb(255 255 255 / .08);--side-hi:#5cc29b;
  --gold:#a37a35;--pos:#16774f;--pos-bg:#e1f2e8;--neg:#b1352b;--neg-bg:#f8e6e3;--warn:#8f5f00;--warn-bg:#f7eed9;--info:#2a5675;--info-bg:#e5eef4;
  --c-ent:#2f8a6b;--c-sai:#c3d1c9;--c-loja:#a37a35;--c-chef:#8b4c2a;--c-geral:#14513f;--grid:#e8eeea;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Montserrat","Inter",ui-sans-serif,system-ui,sans-serif;
  --f-num:"Montserrat","Inter",ui-sans-serif,system-ui,sans-serif;
  --f-brand:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --r:16px;--r-sm:10px;--shadow:0 1px 2px rgb(8 36 27 / .04),0 6px 18px -12px rgb(8 36 27 / .18);--shadow-lg:0 30px 70px rgb(6 30 22 / .22),0 2px 8px rgb(6 30 22 / .08);
  --ease:cubic-bezier(.2,.8,.2,1);--side-w:256px;--top-h:60px;--tab-h:66px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#06120e;--surface:#0b1b15;--surface-2:#10231c;--surface-3:#152e25;--line:#183128;--line-2:#24453a;--ink:#e4efea;--ink-2:#bcd0c7;--muted:#86a095;--faint:#5a7268;
    --accent:#4fb38c;--accent-2:#6fcaa5;--accent-ink:#03130d;--accent-soft:#0f2a20;--accent-line:#1f4a3b;--gold:#d8b36b;--pos:#6fd0a2;--pos-bg:#0f2a1d;--neg:#f08d82;--neg-bg:#2e1613;--warn:#e7b964;--warn-bg:#2a2010;--info:#9cc0db;--info-bg:#13222e;
    --side-bg:linear-gradient(180deg,#04100c 0%,#06150f 100%);
    --c-ent:#4fb38c;--c-sai:#2f4a40;--c-loja:#d8b36b;--c-chef:#d08a5c;--c-geral:#4fb38c;--grid:#14271f;--shadow:none;--shadow-lg:0 30px 70px rgb(0 0 0 / .6);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#06120e;--surface:#0b1b15;--surface-2:#10231c;--surface-3:#152e25;--line:#183128;--line-2:#24453a;--ink:#e4efea;--ink-2:#bcd0c7;--muted:#86a095;--faint:#5a7268;
  --accent:#4fb38c;--accent-2:#6fcaa5;--accent-ink:#03130d;--accent-soft:#0f2a20;--accent-line:#1f4a3b;--gold:#d8b36b;--pos:#6fd0a2;--pos-bg:#0f2a1d;--neg:#f08d82;--neg-bg:#2e1613;--warn:#e7b964;--warn-bg:#2a2010;--info:#9cc0db;--info-bg:#13222e;
  --side-bg:linear-gradient(180deg,#04100c 0%,#06150f 100%);
  --c-ent:#4fb38c;--c-sai:#2f4a40;--c-loja:#d8b36b;--c-chef:#d08a5c;--c-geral:#4fb38c;--grid:#14271f;--shadow:none;--shadow-lg:0 30px 70px rgb(0 0 0 / .6);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.018em;color:var(--ink)}
h1{font-size:clamp(22px,2.6vw,28px);line-height:1.15}
h2{font-size:15.5px;letter-spacing:-.01em}
h3{font-size:15px}
:root[data-ws="chef"] h1{font-family:var(--f-brand);font-weight:600;font-size:clamp(28px,3.2vw,36px);letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.mk{width:22px;height:22px;flex:0 0 auto}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:0}
.sub{font-size:12.5px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .gold{color:var(--gold)}

/* ---------- estrutura */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand svg{width:30px;height:30px}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.wsl{display:grid;gap:2px}
.wsl button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:8px;text-align:left;color:var(--ink-2);font-weight:500;transition:background .15s}
.wsl button svg.mk{width:26px;height:26px;flex:0 0 auto}
.wsl button small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;line-height:1.2}
.wsl button:hover{background:var(--surface-2)}
.wsl button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.navlbl{font-size:11.5px;font-weight:500;color:var(--faint);padding:0 10px;margin-bottom:4px;display:block}
nav.mods{display:grid;gap:1px}
nav.mods button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:8px 10px;color:var(--ink-2);font-weight:500;text-align:left;transition:background .15s,color .15s;position:relative}
nav.mods button svg.i{color:var(--faint);transition:color .15s}
nav.mods button:hover{background:var(--surface-2);color:var(--ink)}
nav.mods button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
nav.mods button[aria-current="page"] svg.i{color:var(--accent)}
:root[data-ws="geral"] nav.mods button[aria-current="page"] svg.i{color:var(--ink)}
nav.mods .badge{margin-left:auto}
.side .foot{margin-top:auto;display:grid;gap:6px}
.acct{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;width:100%}
.acct:hover{background:var(--surface-2)}
.acct img,.av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;object-fit:cover}
.av{display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px}
.acct b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.acct span{font-size:12px;color:var(--muted)}
.badge{min-width:18px;height:18px;border-radius:999px;background:var(--neg);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--f-body);line-height:1}

.shell{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:calc(var(--top-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) 0 28px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--muted)}
.topbar .crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb svg.mk{width:22px;height:22px}
.topbar .sp{flex:1}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:background .15s,transform .1s}
.iconbtn:hover{background:var(--surface-2)} .iconbtn:active{transform:scale(.96)}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;box-shadow:0 0 0 2px var(--bg)}
.iconbtn.ring{border-color:var(--accent-line)}
.avbtn{border:0;background:transparent;padding:0;border-radius:50%;display:grid}
.avbtn img,.avbtn .av{width:34px;height:34px}
.mtop{display:none}
.wseg{display:none}

.main{padding:8px max(20px,env(safe-area-inset-right,0px)) 64px 28px;display:grid;gap:18px;align-content:start;min-width:0;max-width:1280px;width:100%}

/* ---------- cabeçalho de página */
.phead{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;padding-top:10px}
.phead .ttl{display:grid;gap:4px;min-width:0}
.phead .ttl .eyebrow{display:flex;align-items:center;gap:6px}
.phead .ttl .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.phead .ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:8px 13px;font-weight:550;font-size:14px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;text-decoration:none;transition:filter .15s,transform .1s,background .15s;line-height:1.3}
.btn svg.i{width:16px;height:16px}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.wa{background:#1f8f4e;color:#fff}
.link{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:5px 8px;border-radius:8px;white-space:nowrap;font-weight:500;text-decoration:none}
.link svg.i{width:15px;height:15px}
.link:hover{background:var(--surface-2);color:var(--ink)}
.link.armed{background:var(--neg);color:#fff}
.month{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;height:36px}
.month button{border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month span{min-width:126px;text-align:center;font-weight:550;font-size:13.5px}
.seg2{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-weight:500;color:var(--muted);font-size:13px;transition:background .15s,color .15s}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08),0 0 0 1px var(--line)}
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px}
.notice[data-kind="err"]{background:var(--neg-bg);border-color:transparent;color:var(--neg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;max-width:min(460px,calc(100% - 32px));box-shadow:var(--shadow-lg);background:var(--ink);color:var(--bg);border:0;animation:toastIn .3s var(--ease)}
.toast[data-kind="err"]{background:var(--neg);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- blocos */
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.panel-head h2{display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi .eyebrow{font-size:12.5px}
.kpi .v{font-family:var(--f-num);font-size:clamp(18px,2.1vw,24px);font-weight:500;letter-spacing:-.03em;line-height:1.25;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 75%)}
.kpi.hl .eyebrow{color:var(--ink-2)}
.kpi .spark{position:absolute;right:14px;bottom:14px;width:64px;height:24px;opacity:.9}

.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line-2)}
tr.low td{background:var(--warn-bg)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.pill.e,.pill.ok{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.pill.s,.pill.bad{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13.5px;height:34px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13.5px;display:grid;justify-items:center;gap:8px}
.empty svg.i{width:26px;height:26px;color:var(--faint)}

/* ---------- formulários */
form.f,.f{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:8px;border-radius:8px;font-weight:550;color:var(--muted);cursor:pointer;transition:background .15s}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08),0 0 0 1px var(--line)}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 11px;width:100%;min-width:0;font-size:15px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;gap:6px;max-height:200px;overflow:auto;border:1px solid var(--line-2);border-radius:10px;padding:8px;background:var(--surface)}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.formmsg{font-size:13px;min-height:1.2em;margin:0}

.bars{display:grid;gap:12px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.bar .track{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
.bar .fill{height:100%;background:var(--c-ent);border-radius:999px;transform-origin:left;}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px;font-weight:500}
.chip button{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px}
.partner-box{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.partner{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600}
.due{display:grid;justify-items:end}
.due .num{font-size:16px}

/* ---------- linhas (listas) */
.rows{display:grid}
.rowi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.rowi:last-child{border-bottom:0}
.rowi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.rowi .ico svg.i{width:17px;height:17px}
.rowi .ico.e{background:var(--pos-bg);color:var(--pos)} .rowi .ico.s{background:var(--neg-bg);color:var(--neg)}
.rowi b{display:block;font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .end{display:grid;justify-items:end;gap:2px}
.rowi .end .num{font-size:14px}
.datec{width:42px;text-align:center;border-radius:10px;background:var(--surface-2);padding:5px 0;line-height:1.1}
.datec b{display:block;font-family:var(--f-num);font-size:15px;font-weight:500}
.datec span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.alert .lv{width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.alert .lv svg.i{width:16px;height:16px}
.alert[data-lv="alta"] .lv{background:var(--neg-bg);color:var(--neg)} .alert[data-lv="media"] .lv{background:var(--warn-bg);color:var(--warn)} .alert[data-lv="info"] .lv{background:var(--info-bg);color:var(--info)}
.alert b{display:block;font-size:13.5px;font-weight:550}
.alert .acts2{display:flex;gap:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tag i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tag.loja i{background:var(--c-loja)} .tag.chef i{background:var(--c-chef)} .tag.geral i{background:var(--faint)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:9px;align-content:start;min-width:0;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .2s}
.card:hover{border-color:var(--line-2)}
.card .top2{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card .meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .meta svg.i{width:14px;height:14px}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.card img.cr{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.stats b{display:block;font-family:var(--f-num);font-size:14px;color:var(--ink);font-weight:500}

/* ---------- ajuda */
.helpbody{display:grid;gap:16px}
.helpbody p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.guide ol,.helpbody ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:g}
.helpbody ol li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:14px;counter-increment:g}
.helpbody ol li::before{content:counter(g);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--ink);border:1px solid var(--accent-line);display:grid;place-items:center;font-size:12px;font-weight:600}
.terms{display:grid;gap:6px}
.terms span{font-size:13px;background:var(--surface-2);border-radius:9px;padding:7px 10px;color:var(--ink-2)}
.terms b{color:var(--ink);font-weight:600}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:#fff}
.step .ck svg.i{width:12px;height:12px;stroke-width:2.5}
.step.ok .ck{background:var(--pos);border-color:var(--pos)}
.step.ok b{text-decoration:line-through;color:var(--muted);font-weight:400}
.step b{font-weight:500;font-size:13.5px}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .6s var(--ease)}

/* ---------- empresas (visão das sócias) */
.cos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.co{position:relative;overflow:hidden;border-radius:var(--r);padding:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:14px;box-shadow:var(--shadow);text-align:left;color:var(--ink);transition:border-color .15s,transform .2s var(--ease)}
.co:hover{border-color:var(--line-2);transform:translateY(-1px)}
.co::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--co)}
.co.loja{--co:var(--c-loja)} .co.chef{--co:linear-gradient(90deg,#6d3fc0,#b8803a)}
.co .hd{display:flex;gap:12px;align-items:center}
.co .hd svg.mk{width:40px;height:40px}
.co h2{font-size:16px}
.co.chef h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:600;letter-spacing:0}
.co .hd span{font-size:12.5px;color:var(--muted)}
.co .hd .go{margin-left:auto;color:var(--muted)}
.co .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.co .nums span{display:block;font-size:12px;color:var(--muted)}
.co .nums b{font-family:var(--f-num);font-weight:500;font-size:15.5px;letter-spacing:-.02em}
.co.saldo{grid-template-columns:1fr}
.co.saldo h2{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.01em}
.co.saldo .nums b{font-size:15px}
.partner-box,.partner>div{min-width:0}
.partner-box .sub.num{font-family:var(--f-body);font-size:12.5px}
.rowi .end{display:flex;align-items:center;gap:2px}
.kpi .v.two{font-size:clamp(13.5px,1.4vw,16px);white-space:pre-line;line-height:1.45}

/* ---------- gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:11px var(--f-num);fill:var(--faint)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 4%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;border-radius:2px;width:14px}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);border-radius:10px;padding:9px 11px;font-size:12.5px;min-width:150px;display:grid;gap:3px;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s}
.tip b{font-weight:600;font-size:12.5px;margin-bottom:2px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip div span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------- agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0;font-weight:500}
.cal .day{min-height:86px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px;display:grid;align-content:start;gap:3px;text-align:left;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.cal .day:hover{border-color:var(--accent-line)}
.cal .day.out{opacity:.4}
.cal .day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px;justify-self:start}
.cal .day.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal .n{font-size:12px;font-weight:600;font-family:var(--f-num)}
.ev{font-size:11px;line-height:1.35;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);color:var(--ink);font-weight:500;border-left:2px solid var(--faint)}
.ev.pedido{background:color-mix(in srgb,#6d3fc0 14%,var(--surface));border-left-color:#6d3fc0}
.ev.anuncio{background:var(--warn-bg);color:var(--warn);border-left-color:var(--warn)}
.ev.geral{background:var(--pos-bg);color:var(--pos);border-left-color:var(--pos)}
.ev.lojaev{background:color-mix(in srgb,#4f46e5 13%,var(--surface));border-left-color:#4f46e5}
.ev.data{background:transparent;color:var(--gold);border:1px dashed currentColor}
.dmonth{display:grid;gap:10px}
.dmonth>h2{display:flex;align-items:baseline;gap:10px;font-size:17px}
.dmonth>h2 small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:500}
.dlist{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.dcard.now{border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent),var(--shadow)}
.dcard.done{opacity:.65}
.dday{display:grid;place-items:center;align-content:center;border-radius:11px;background:var(--surface-2);padding:8px 4px;text-align:center}
.dday b{font-family:var(--f-num);font-size:21px;line-height:1;font-weight:500}
.dday span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.dbody{display:grid;gap:6px;min-width:0}
.dbody .t{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dbody p{margin:0;font-size:13.5px;color:var(--ink-2)}
.dbody .when{font-size:12.5px;color:var(--muted)}
.dbody .acts{display:flex;flex-wrap:wrap;gap:6px}
.daylist{display:grid;gap:0}
.daylist .it{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.daylist .it:last-child{border-bottom:0}
.daylist .it>.num{font-size:12.5px;color:var(--muted)}
.daylist .it b{font-weight:550;font-size:13.5px}

/* ---------- integrações */
.integ{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ig{display:grid;gap:10px;align-content:start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left;color:var(--ink);transition:border-color .15s}
.ig:hover{border-color:var(--line-2)}
.ig .hd{display:flex;align-items:center;gap:10px}
.ig .lg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.ig .lg svg.i{width:19px;height:19px}
.ig b{font-weight:600}
.ig p{margin:0;font-size:13px;color:var(--muted)}
.qr{display:grid;place-items:center;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line);justify-self:center}
.qr svg{width:180px;height:180px}
code.cp{display:block;font:12px var(--f-num);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px;word-break:break-all;max-height:90px;overflow:auto}

/* ---------- janelas */
.overlay{position:fixed;inset:0;background:rgb(8 8 14 / .45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));z-index:70;animation:fadeIn .18s ease}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--line);width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow-lg);animation:popIn .26s var(--ease)}
.modal>.mh{display:flex;align-items:center;gap:10px}
.modal>.mh h2{font-size:17px;flex:1}
.modal>.mh .x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:-22px;background:var(--surface);padding:12px 0 2px;margin-top:-4px}
.overlay.drawer{place-items:stretch end;padding:0}
.overlay.drawer .modal{width:min(420px,100%);height:100%;max-height:none;border-radius:0;border-width:0 0 0 1px;align-content:start;animation:slideL .3s var(--ease);padding-top:calc(22px + env(safe-area-inset-top,0px))}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.985)}}
@keyframes slideL{from{transform:translateX(30px);opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}}
.gate{max-width:420px;margin:14vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:12px;text-align:center;box-shadow:var(--shadow)}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- central de alertas / conta */
.pushcard{display:grid;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--accent-line);background:var(--accent-soft)}
.pushcard .hd{display:flex;gap:10px;align-items:center}
.pushcard .hd .lg{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.pushcard.ok{border-color:transparent;background:var(--pos-bg)}
.pushcard.ok .hd .lg{background:var(--pos);color:#fff}
.pushcard ol{margin:0;padding-left:20px;display:grid;gap:5px;font-size:13.5px}
.menu{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.menu>*{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;text-decoration:none;color:var(--ink);font-weight:500;width:100%}
.menu>*:last-child{border-bottom:0}
.menu>*:hover{background:var(--surface-2)}
.menu>* svg.i{color:var(--muted)}
.menu>* .end{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}

/* ---------- barra inferior (celular) */
.tabbar{display:none}

/* ---------- movimento */
.anim .main>*{animation:rise .42s var(--ease) both}
.anim .main>*:nth-child(2){animation-delay:.04s}.anim .main>*:nth-child(3){animation-delay:.08s}.anim .main>*:nth-child(4){animation-delay:.12s}.anim .main>*:nth-child(5){animation-delay:.16s}.anim .main>*:nth-child(n+6){animation-delay:.2s}
.anim .col>*{animation:rise .42s var(--ease) both}
.anim .col>*:nth-child(2){animation-delay:.05s}.anim .col>*:nth-child(3){animation-delay:.1s}.anim .col>*:nth-child(n+4){animation-delay:.15s}
.anim .chart .bm{animation:grow .6s var(--ease) both;transform-box:fill-box;transform-origin:bottom}
.anim .chart .ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s .15s var(--ease) forwards}
.anim .bar .fill{animation:growX .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- modo discreto (ocultar valores) */
.priv .num,.priv .kpi .v,.priv .co .nums b,.priv .stats b,.priv .chart .ax,.priv .tip span.num{filter:blur(7px);user-select:none}
.priv .kpi .v,.priv .num{transition:filter .2s}

/* ---------- impressão (relatório) */
@media print{
  .side,.topbar,.tabbar,.wseg,.phead .ctrls,.acts,.link,.btn,.filters,.mtop{display:none!important}
  .app{display:block} .main{padding:0;max-width:none}
  body{background:#fff;font-size:12px} .panel,.kpi,.card{box-shadow:none;break-inside:avoid}
  .anim .main>*,.anim .col>*{animation:none}
}

/* ---------- responsivo */
@media (max-width:1100px){.grid,.grid.even{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.cos{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 88%,transparent)}
  .topbar .crumb{display:none}
  .mtop{display:flex;align-items:center;gap:9px;min-width:0}
  .mtop svg{width:28px;height:28px;flex:0 0 auto}
  .mtop b{font-weight:600;font-size:16px;letter-spacing:-.01em}
  .wseg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:2px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--surface-2);border-radius:12px;padding:3px}
  .wseg button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13.5px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
  .wseg button svg.mk{width:18px;height:18px}
  .wseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08),0 0 0 1px var(--line)}
  .main{padding:6px max(16px,env(safe-area-inset-right,0px)) calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:14px}
  .phead{padding-top:8px;gap:12px}
  .phead .ctrls{width:100%}
  .phead .ctrls .btn:not(.ghost){margin-left:auto}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line)}
  .tabbar button{position:relative;display:grid;justify-items:center;gap:3px;border:0;background:transparent;padding:6px 2px;border-radius:10px;color:var(--faint);font-size:10.5px;font-weight:500;letter-spacing:.01em}
  .tabbar button svg.i{width:22px;height:22px;stroke-width:1.6}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  :root[data-ws="geral"] .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  .kpis{gap:10px}
  .kpi{padding:12px 13px}
  .kpi .spark{display:none}
  .panel{padding:15px}
  .overlay{place-items:end stretch;padding:0}
  .modal{width:100%;max-height:92vh;border-radius:20px 20px 0 0;border-width:1px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:slideUp .32s var(--ease)}
  .modal::before{content:"";width:38px;height:4px;border-radius:4px;background:var(--line-2);justify-self:center;margin:-8px 0 -4px}
  .modal .acts{bottom:calc(-18px - env(safe-area-inset-bottom,0px));padding-bottom:4px}
  .modal .acts>*{flex:1}
  .overlay.drawer{place-items:end stretch}
  .overlay.drawer .modal{width:100%;height:auto;max-height:92vh;border-radius:20px 20px 0 0;border-width:1px 0 0;animation:slideUp .32s var(--ease);padding-top:18px}
  .cal .day{min-height:52px;padding:4px}
  .cal .ev{font-size:0;height:4px;padding:0;border:0}
  .cal .ev.data{height:4px;border:0;background:var(--gold)}
  .toast{bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px))}
  .co .nums b{font-size:14.5px}
}
@media (max-width:420px){.two{grid-template-columns:1fr}.month span{min-width:104px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ---------- v3 · Cota: ajustes de linguagem visual (sobrepõem o v2) */
body{font-size:14.5px;font-feature-settings:"ss01","cv11"}
.num,.kpi .v,.co .nums b,.datec b{font-family:var(--f-num);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum"}
h1{font-size:clamp(22px,2.4vw,26px);letter-spacing:-.022em;font-weight:600}
:root[data-ws="chef"] h1{font-family:var(--f-display);font-size:clamp(22px,2.4vw,26px);letter-spacing:-.022em}
.co.chef h2{font-family:var(--f-display);font-size:16px;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;letter-spacing:.02em}
.phead .ttl .eyebrow{text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:550;color:var(--muted)}
.phead .ttl .eyebrow .dot{width:6px;height:6px;border-radius:2px;background:var(--wsc,var(--accent))}
:root[data-ws="loja"]{--wsc:var(--c-loja)} :root[data-ws="chef"]{--wsc:var(--c-chef)} :root[data-ws="geral"]{--wsc:var(--c-geral)}
.panel,.kpi,.co{border-radius:var(--r);box-shadow:var(--shadow)}
.panel{padding:18px 20px}
.panel-head h2,.panel>h2{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.kpi{padding:14px 16px 15px}
.kpi .eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-weight:600;letter-spacing:-.025em;font-size:clamp(19px,2vw,24px)}

function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h2=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h2-k)%7,m=Math.floor((a+11*h2+22*l)/451),mo=Math.floor((h2+l-7*m+114)/31),da=((h2+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function nthDow(y,mo,dow,n){const d=new Date(y,mo-1,1);const off=(dow-d.getDay()+7)%7;return new Date(y,mo-1,1+off+7*(n-1));}
const FX=(m,d)=>y=>new Date(y,m-1,d);
const PASC=n=>y=>{const p=pascoa(y);return new Date(p.getFullYear(),p.getMonth(),p.getDate()+n);};

  carpaccio:{n:"Carpaccio de carne com rúcula e parmesão",tipo:"entrada",t:20,ing:[["Lagarto limpo (fatiado bem fino)",60,"g",C_CARNE],["Rúcula",20,"g",C_HORTI],["Parmesão em lascas",15,"g",C_LATI],["Alcaparras",5,"g",C_MERC],["Limão-siciliano",0.25,"un",C_HORTI],["Mostarda Dijon",5,"g",C_MERC],["Azeite extravirgem",10,"ml",C_MERC]],prep:["Congele a carne por 1 hora e fatie bem fino (ou peça fatiado no açougue).","Disponha as fatias no prato, sem sobrepor.","Bata azeite, suco de limão e mostarda para o molho.","Finalize com rúcula, parmesão, alcaparras, sal e pimenta-do-reino na hora de servir."]},
  risoto_cog:{n:"Risoto de cogumelos frescos",tipo:"acompanhamento",t:35,ing:[["Arroz arbóreo",70,"g",C_MERC],["Cogumelo paris",60,"g",C_HORTI],["Shiitake",40,"g",C_HORTI],["Cebola",30,"g",C_HORTI],["Vinho branco seco",30,"ml",C_BEB],["Caldo de legumes",250,"ml",C_MERC],["Manteiga",15,"g",C_LATI],["Parmesão ralado",20,"g",C_LATI],["Azeite extravirgem",15,"ml",C_MERC,"f"]],prep:["Mantenha o caldo quente em fogo baixo.","Doure os cogumelos no azeite e reserve.","Refogue a cebola, junte o arroz e mexa por 1 minuto; deglaceie com o vinho.","Adicione o caldo aos poucos, mexendo, por 16 a 18 minutos.","Volte os cogumelos e finalize fora do fogo com manteiga gelada e parmesão."]},
  file_vinho:{n:"Medalhão de filé mignon ao molho de vinho tinto",tipo:"principal",t:30,ing:[["Filé mignon (medalhões)",200,"g",C_CARNE],["Vinho tinto seco",50,"ml",C_BEB],["Caldo de carne",50,"ml",C_MERC],["Echalota (ou cebola roxa)",15,"g",C_HORTI],["Manteiga",10,"g",C_LATI],["Açúcar mascavo",3,"g",C_MERC],["Alho",0.5,"dente",C_HORTI],["Tomilho fresco",1,"maço",C_TEMP,"f"]],prep:["Tempere os medalhões com sal e pimenta e deixe em temperatura ambiente por 20 minutos.","Sele em frigideira bem quente, 3 a 4 minutos de cada lado para ponto médio. Reserve.","Na mesma frigideira, refogue echalota e alho, junte vinho, caldo, tomilho e mascavo e reduza à metade.","Finalize o molho com manteiga gelada e sirva sobre os medalhões."]},
  petit:{n:"Petit gâteau com sorvete de creme",tipo:"sobremesa",t:25,ing:[["Chocolate meio amargo",40,"g",C_MERC],["Manteiga",30,"g",C_LATI],["Ovo",1,"un",C_LATI],["Açúcar",20,"g",C_MERC],["Farinha de trigo",10,"g",C_MERC],["Sorvete de creme",80,"ml",C_LATI]],prep:["Derreta chocolate e manteiga em banho-maria.","Bata ovos e açúcar até clarear, junte o chocolate e a farinha peneirada.","Distribua em forminhas untadas e leve à geladeira (pode ser feito na véspera).","Asse a 220 °C por 7 a 9 minutos: as bordas firmes e o centro mole. Desenforme e sirva com sorvete."]},
  bruschetta:{n:"Bruschetta de tomate e manjericão",tipo:"entrada",t:15,ing:[["Pão italiano",60,"g",C_PAD],["Tomate italiano",80,"g",C_HORTI],["Manjericão fresco",1,"maço",C_TEMP,"f"],["Alho",0.25,"dente",C_HORTI],["Azeite extravirgem",10,"ml",C_MERC]],prep:["Corte o tomate em cubinhos, sem sementes, e tempere com sal, azeite e manjericão.","Toste as fatias de pão e esfregue o alho.","Cubra com o tomate na hora de servir para não amolecer."]},
  caprese:{n:"Salada caprese",tipo:"entrada",t:10,ing:[["Muçarela de búfala",60,"g",C_LATI],["Tomate italiano",80,"g",C_HORTI],["Manjericão fresco",1,"maço",C_TEMP,"f"],["Azeite extravirgem",10,"ml",C_MERC],["Redução de balsâmico",5,"ml",C_MERC]],prep:["Fatie tomate e muçarela na mesma espessura.","Intercale no prato com folhas de manjericão.","Finalize com azeite, sal, pimenta e fios de balsâmico."]},
  lasanha:{n:"Lasanha à bolonhesa",tipo:"principal",t:90,ing:[["Massa de lasanha",70,"g",C_MERC],["Carne moída (patinho)",150,"g",C_CARNE],["Passata de tomate",150,"ml",C_MERC],["Cebola",30,"g",C_HORTI],["Alho",1,"dente",C_HORTI],["Muçarela fatiada",60,"g",C_LATI],["Presunto fatiado",40,"g",C_LATI],["Parmesão ralado",15,"g",C_LATI],["Leite integral",100,"ml",C_LATI],["Manteiga",10,"g",C_LATI],["Farinha de trigo",10,"g",C_MERC],["Noz-moscada",1,"pitada",C_TEMP,"f"]],prep:["Bolonhesa: doure a carne, junte cebola e alho, depois a passata. Cozinhe 30 minutos em fogo baixo.","Bechamel: derreta a manteiga, junte a farinha, depois o leite aos poucos, mexendo até engrossar. Tempere com sal e noz-moscada.","Monte em camadas: molho, massa, bechamel, presunto e muçarela. Termine com molho, bechamel e parmesão.","Cubra com papel-alumínio e asse a 200 °C por 30 minutos; retire o papel e gratine por mais 10."]},
  tiramisu:{n:"Tiramisù",tipo:"sobremesa",t:30,ing:[["Mascarpone",60,"g",C_LATI],["Creme de leite fresco",40,"ml",C_LATI],["Biscoito champanhe",5,"un",C_MERC],["Café espresso",50,"ml",C_BEB],["Açúcar",20,"g",C_MERC],["Cacau em pó",3,"g",C_MERC]],prep:["Bata o creme de leite em ponto de chantilly com o açúcar e misture delicadamente ao mascarpone.","Molhe rapidamente os biscoitos no café frio.","Monte camadas de biscoito e creme em taças ou travessa.","Leve à geladeira por pelo menos 6 horas e polvilhe cacau na hora de servir."]},
  picanha:{n:"Picanha na brasa",tipo:"principal",t:40,ing:[["Picanha",250,"g",C_CARNE],["Sal grosso",15,"g",C_TEMP],["Carvão",0.5,"kg",C_OUT]],prep:["Corte a picanha em bifes grossos (3 dedos) a favor da gordura.","Tempere com sal grosso só na hora de ir para a grelha.","Asse com a gordura para baixo primeiro, em brasa alta, e vire uma vez.","Descanse 3 minutos antes de fatiar contra a fibra."]},
  linguica:{n:"Linguiça toscana",tipo:"principal",t:30,ing:[["Linguiça toscana",120,"g",C_CARNE]],prep:["Asse em brasa média, virando sempre, por 20 a 25 minutos, até dourar por igual.","Sirva fatiada como petisco antes das carnes."]},
  pao_alho:{n:"Pão de alho caseiro",tipo:"acompanhamento",t:20,ing:[["Pão francês",1.5,"un",C_PAD],["Manteiga",10,"g",C_LATI],["Maionese",10,"g",C_MERC],["Alho",1,"dente",C_HORTI],["Parmesão ralado",5,"g",C_LATI],["Salsinha",1,"maço",C_TEMP,"f"]],prep:["Misture manteiga, maionese, alho amassado, parmesão e salsinha.","Faça cortes no pão sem separar as fatias e recheie.","Embrulhe em papel-alumínio e asse na grelha por 10 minutos; abra e doure."]},
  farofa_bacon:{n:"Farofa de bacon",tipo:"acompanhamento",t:15,ing:[["Farinha de mandioca torrada",40,"g",C_MERC],["Bacon em cubos",25,"g",C_CARNE],["Manteiga",10,"g",C_LATI],["Cebola",15,"g",C_HORTI],["Salsinha",1,"maço",C_TEMP,"f"]],prep:["Frite o bacon até dourar e junte a manteiga e a cebola.","Acrescente a farinha aos poucos, mexendo até ficar soltinha e dourada.","Acerte o sal e finalize com salsinha."]},
  vinagrete:{n:"Vinagrete",tipo:"acompanhamento",t:15,ing:[["Tomate",60,"g",C_HORTI],["Cebola",25,"g",C_HORTI],["Pimentão",20,"g",C_HORTI],["Vinagre de vinho branco",10,"ml",C_MERC],["Azeite extravirgem",10,"ml",C_MERC],["Salsinha",1,"maço",C_TEMP,"f"]],prep:["Pique tudo em cubos pequenos e iguais.","Tempere com vinagre, azeite e sal 30 minutos antes de servir."]},
  abacaxi:{n:"Abacaxi grelhado com canela",tipo:"sobremesa",t:15,ing:[["Abacaxi",0.2,"un",C_HORTI],["Açúcar mascavo",10,"g",C_MERC],["Canela em pó",1,"pitada",C_TEMP,"f"]],prep:["Corte o abacaxi em fatias grossas ou em espetos.","Polvilhe açúcar e canela e grelhe até caramelizar dos dois lados."]},
  feijoada:{n:"Feijoada completa",tipo:"principal",t:240,ing:[["Feijão preto",80,"g",C_MERC],["Carne-seca",50,"g",C_CARNE],["Costelinha suína defumada",60,"g",C_CARNE],["Lombo suíno salgado",40,"g",C_CARNE],["Paio",40,"g",C_CARNE],["Linguiça calabresa",40,"g",C_CARNE],["Bacon",20,"g",C_CARNE],["Cebola",30,"g",C_HORTI],["Alho",1,"dente",C_HORTI],["Folha de louro",2,"un",C_TEMP,"f"],["Laranja pera (para servir)",0.5,"un",C_HORTI]],prep:["Na véspera: deixe as carnes salgadas de molho, trocando a água 3 vezes, e o feijão de molho.","Cozinhe o feijão com louro na pressão por 25 minutos.","Afervente as carnes salgadas e cozinhe com o feijão; junte defumados e linguiças por mais 40 minutos.","Refogue bacon, cebola e alho, junte uma concha de feijão amassado e devolva à panela para engrossar.","Sirva com arroz, couve, farofa e laranja."]},
  arroz:{n:"Arroz branco soltinho",tipo:"acompanhamento",t:25,ing:[["Arroz agulhinha",70,"g",C_MERC],["Cebola",10,"g",C_HORTI],["Alho",0.5,"dente",C_HORTI],["Óleo",10,"ml",C_MERC,"f"]],prep:["Refogue cebola e alho no óleo, junte o arroz e frite por 1 minuto.","Cubra com água fervente (2 partes de água para 1 de arroz) e sal.","Cozinhe tampado em fogo baixo até secar; descanse 5 minutos antes de soltar com o garfo."]},
  couve:{n:"Couve refogada",tipo:"acompanhamento",t:10,ing:[["Couve-manteiga",0.25,"maço",C_HORTI],["Alho",0.5,"dente",C_HORTI],["Azeite extravirgem",10,"ml",C_MERC,"f"]],prep:["Fatie a couve bem fina.","Refogue o alho no azeite, junte a couve e salteie por 1 minuto, só até murchar. Sal na hora."]},
  brigadeiro_colher:{n:"Brigadeiro de colher",tipo:"sobremesa",t:20,ing:[["Leite condensado",100,"g",C_MERC],["Creme de leite",25,"g",C_LATI],["Chocolate 50% cacau",15,"g",C_MERC],["Manteiga",5,"g",C_LATI]],prep:["Leve tudo ao fogo baixo, mexendo sempre, até desgrudar do fundo da panela.","Sirva morno em potinhos ou taças."]},
  caipirinha:{n:"Caipirinha de limão",tipo:"bebida",t:5,ing:[["Limão taiti",1,"un",C_HORTI],["Cachaça",50,"ml",C_BEB],["Açúcar",15,"g",C_MERC],["Gelo",150,"g",C_BEB]],prep:["Corte o limão em gomos, tire o miolo branco e amasse com o açúcar.","Complete com gelo e cachaça e mexa. Faça uma versão sem álcool com água com gás."]},
  ceviche:{n:"Ceviche de peixe branco",tipo:"entrada",t:20,ing:[["Peixe branco fresco (robalo ou tilápia)",80,"g",C_CARNE],["Limão taiti",1,"un",C_HORTI],["Cebola roxa",20,"g",C_HORTI],["Pimenta dedo-de-moça",0.1,"un",C_HORTI],["Coentro",1,"maço",C_TEMP,"f"],["Batata-doce cozida",40,"g",C_HORTI]],prep:["Corte o peixe em cubos de 1,5 cm e mantenha bem gelado.","Tempere com sal, cebola roxa fatiada e pimenta.","Cubra com suco de limão e deixe marinar 5 a 8 minutos.","Finalize com coentro e sirva com batata-doce."]},
  moqueca:{n:"Moqueca de peixe e camarão",tipo:"principal",t:45,ing:[["Peixe em postas (robalo ou badejo)",180,"g",C_CARNE],["Camarão limpo",80,"g",C_CARNE],["Leite de coco",80,"ml",C_MERC],["Azeite de dendê",10,"ml",C_MERC],["Tomate",70,"g",C_HORTI],["Pimentão colorido",50,"g",C_HORTI],["Cebola",40,"g",C_HORTI],["Limão taiti",0.5,"un",C_HORTI],["Coentro",1,"maço",C_TEMP,"f"]],prep:["Tempere peixe e camarão com limão, sal e alho por 20 minutos.","Na panela de barro, faça camadas de cebola, tomate e pimentão; acomode o peixe por cima.","Regue com leite de coco e dendê, tampe e cozinhe 15 minutos sem mexer.","Junte o camarão nos últimos 5 minutos e finalize com coentro."]},
  pirao:{n:"Pirão de peixe",tipo:"acompanhamento",t:15,ing:[["Farinha de mandioca fina",20,"g",C_MERC],["Caldo de peixe (da moqueca)",100,"ml",C_MERC]],prep:["Separe parte do caldo quente da moqueca.","Junte a farinha aos poucos, mexendo sem parar, até ficar cremoso."]},
  mousse_maracuja:{n:"Mousse de maracujá",tipo:"sobremesa",t:15,ing:[["Leite condensado",100,"g",C_MERC],["Creme de leite",50,"g",C_LATI],["Maracujá",1,"un",C_HORTI]],prep:["Bata leite condensado, creme de leite e o suco concentrado da polpa no liquidificador.","Distribua em taças, cubra com sementes e gele por 3 horas."]},
  creme_abobora:{n:"Creme de abóbora com gengibre",tipo:"entrada",t:35,ing:[["Abóbora cabotiá",200,"g",C_HORTI],["Cebola",30,"g",C_HORTI],["Gengibre",3,"g",C_HORTI],["Caldo de legumes",200,"ml",C_MERC],["Creme de leite",20,"g",C_LATI],["Azeite extravirgem",10,"ml",C_MERC,"f"]],prep:["Refogue cebola e gengibre no azeite.","Junte a abóbora em cubos e o caldo; cozinhe até desmanchar.","Bata no liquidificador, volte ao fogo com o creme de leite e acerte o sal."]},
  salada_quinoa:{n:"Salada de quinoa com legumes assados",tipo:"entrada",t:40,ing:[["Quinoa",50,"g",C_MERC],["Abobrinha",60,"g",C_HORTI],["Berinjela",50,"g",C_HORTI],["Pimentão colorido",30,"g",C_HORTI],["Grão-de-bico cozido",40,"g",C_MERC],["Hortelã",1,"maço",C_TEMP,"f"],["Limão-siciliano",0.25,"un",C_HORTI],["Azeite extravirgem",15,"ml",C_MERC]],prep:["Cozinhe a quinoa em água com sal por 12 minutos e escorra.","Asse os legumes em cubos com azeite a 220 °C por 25 minutos.","Misture tudo com grão-de-bico, hortelã, raspas e suco de limão."]},
  nhoque:{n:"Nhoque de batata ao sugo",tipo:"principal",t:60,ing:[["Batata asterix",250,"g",C_HORTI],["Farinha de trigo",60,"g",C_MERC],["Ovo",0.25,"un",C_LATI],["Tomate pelado",150,"g",C_MERC],["Alho",1,"dente",C_HORTI],["Manjericão fresco",1,"maço",C_TEMP,"f"],["Parmesão ralado",15,"g",C_LATI],["Azeite extravirgem",10,"ml",C_MERC]],prep:["Cozinhe as batatas com casca, descasque e passe no espremedor ainda quentes.","Junte ovo, sal e farinha aos poucos até a massa parar de grudar.","Faça rolinhos, corte e cozinhe em água fervente até subirem.","Molho: doure o alho no azeite, junte o tomate e cozinhe 15 minutos; finalize com manjericão e parmesão."]},
  panna_cotta:{n:"Panna cotta com calda de frutas vermelhas",tipo:"sobremesa",t:20,ing:[["Creme de leite fresco",100,"ml",C_LATI],["Leite integral",30,"ml",C_LATI],["Açúcar",25,"g",C_MERC],["Gelatina incolor",2,"g",C_MERC],["Frutas vermelhas congeladas",50,"g",C_HORTI]],prep:["Hidrate a gelatina conforme a embalagem.","Aqueça creme, leite e parte do açúcar sem ferver, dissolva a gelatina e distribua em taças.","Gele por 4 horas.","Calda: cozinhe as frutas com o restante do açúcar por 8 minutos."]},
  salpicao:{n:"Salpicão de frango",tipo:"entrada",t:40,ing:[["Peito de frango",80,"g",C_CARNE],["Maionese",30,"g",C_MERC],["Cenoura",30,"g",C_HORTI],["Milho verde em conserva",20,"g",C_MERC],["Uva-passa",10,"g",C_MERC],["Maçã verde",0.25,"un",C_HORTI],["Batata palha",15,"g",C_MERC]],prep:["Cozinhe o frango em água temperada e desfie.","Rale a cenoura e corte a maçã em cubinhos.","Misture tudo com a maionese e gele. Batata palha só na hora de servir."]},
  pernil:{n:"Pernil assado com laranja",tipo:"principal",t:300,ing:[["Pernil suíno com osso",350,"g",C_CARNE],["Laranja pera",0.5,"un",C_HORTI],["Alho",2,"dente",C_HORTI],["Vinho branco seco",30,"ml",C_BEB],["Folha de louro",2,"un",C_TEMP,"f"]],prep:["Na véspera, fure a carne e tempere com alho, sal, suco de laranja, vinho e louro.","Asse coberto com papel-alumínio a 180 °C por cerca de 40 minutos por quilo.","Retire o papel, regue com o molho e doure por mais 40 minutos."]},
  arroz_natal:{n:"Arroz com passas e amêndoas",tipo:"acompanhamento",t:30,ing:[["Arroz agulhinha",70,"g",C_MERC],["Uva-passa",10,"g",C_MERC],["Amêndoas laminadas",10,"g",C_MERC],["Manteiga",5,"g",C_LATI],["Cebola",10,"g",C_HORTI]],prep:["Prepare o arroz branco como de costume.","Toste as amêndoas na manteiga e junte as passas.","Misture ao arroz pronto na hora de servir."]},
  pave:{n:"Pavê de chocolate",tipo:"sobremesa",t:40,ing:[["Biscoito maisena",40,"g",C_MERC],["Leite condensado",100,"g",C_MERC],["Creme de leite",50,"g",C_LATI],["Leite integral",100,"ml",C_LATI],["Amido de milho",5,"g",C_MERC],["Ovo (gema)",1,"un",C_LATI],["Chocolate meio amargo",20,"g",C_MERC]],prep:["Creme branco: cozinhe leite condensado, leite, gema e amido até engrossar.","Ganache: derreta o chocolate com o creme de leite.","Monte camadas de biscoito umedecido no leite, creme e ganache. Gele por 6 horas."]},
  ovos_mexidos:{n:"Ovos mexidos cremosos",tipo:"principal",t:10,ing:[["Ovo",2,"un",C_LATI],["Manteiga",10,"g",C_LATI],["Creme de leite",15,"g",C_LATI],["Cebolinha",1,"maço",C_TEMP,"f"]],prep:["Bata levemente os ovos com sal.","Cozinhe em fogo baixo com manteiga, mexendo sempre, e tire do fogo ainda úmidos.","Finalize com creme de leite e cebolinha."]},
  panqueca:{n:"Panquecas americanas com mel e frutas",tipo:"principal",t:25,ing:[["Farinha de trigo",50,"g",C_MERC],["Leite integral",60,"ml",C_LATI],["Ovo",0.5,"un",C_LATI],["Açúcar",8,"g",C_MERC],["Fermento químico",2,"g",C_MERC],["Manteiga",5,"g",C_LATI],["Mel",20,"g",C_MERC],["Frutas vermelhas frescas",40,"g",C_HORTI]],prep:["Misture os secos e, à parte, os líquidos; junte sem bater demais.","Cozinhe porções em frigideira untada até formar bolhas; vire.","Sirva em pilhas com mel e frutas."]},
  tabua:{n:"Tábua de queijos, frios e frutas",tipo:"entrada",t:20,ing:[["Queijo brie",30,"g",C_LATI],["Presunto parma",25,"g",C_LATI],["Melão",100,"g",C_HORTI],["Uva sem semente",60,"g",C_HORTI],["Pão de fermentação natural",60,"g",C_PAD],["Geleia de frutas",15,"g",C_MERC]],prep:["Fatie o melão e enrole o parma por cima.","Monte a tábua com queijos em temperatura ambiente, frutas, pães e geleia."]},
  suco_laranja:{n:"Suco de laranja natural",tipo:"bebida",t:10,ing:[["Laranja pera",3,"un",C_HORTI]],prep:["Esprema na hora (3 laranjas rendem cerca de 300 ml) e sirva gelado."]},
  cafe:{n:"Café coado",tipo:"bebida",t:10,ing:[["Café em pó",10,"g",C_MERC]],prep:["Use 10 g de pó para cada 150 ml de água a 92 °C."]},
  frango_grelhado:{n:"Frango grelhado com ervas",tipo:"principal",t:20,ing:[["Peito de frango",150,"g",C_CARNE],["Limão taiti",0.25,"un",C_HORTI],["Alho",0.5,"dente",C_HORTI],["Azeite extravirgem",5,"ml",C_MERC]],prep:["Tempere com limão, alho, sal e ervas por 30 minutos.","Grelhe em frigideira bem quente, 4 a 5 minutos de cada lado."]},
  arroz_integral:{n:"Arroz integral",tipo:"acompanhamento",t:40,ing:[["Arroz integral",50,"g",C_MERC],["Cebola",10,"g",C_HORTI]],prep:["Refogue e cozinhe com 3 partes de água por 35 a 40 minutos."]},
  feijao:{n:"Feijão carioca temperado",tipo:"acompanhamento",t:50,ing:[["Feijão carioca",40,"g",C_MERC],["Alho",0.5,"dente",C_HORTI],["Cebola",10,"g",C_HORTI],["Folha de louro",1,"un",C_TEMP,"f"]],prep:["Cozinhe na pressão com louro por 25 minutos.","Tempere com alho e cebola refogados."]},
  legumes:{n:"Legumes no vapor",tipo:"acompanhamento",t:15,ing:[["Brócolis",80,"g",C_HORTI],["Cenoura",50,"g",C_HORTI],["Abobrinha",50,"g",C_HORTI]],prep:["Cozinhe no vapor até ficarem macios e ainda firmes (6 a 8 minutos)."]},
  embalagem:{n:"Embalagem de marmita",tipo:"bebida",t:0,ing:[["Embalagem de marmita (com tampa)",1,"un",C_OUT],["Etiqueta com data",1,"un",C_OUT]],prep:["Monte, feche, etiquete com nome e data. Validade: 3 dias na geladeira ou 30 dias no freezer."]}

(async()=>{
  const [db,user,assets,sample,downloads]=await Promise.all(["db","user","assets","sample","downloads"].map(n=>claude.use(n)));
  if(!db){$("bootMsg").textContent="Não deu para conectar ao banco de dados. Recarregue a página.";return;}

  const sub=(col)=>db.collection(col).onSnapshot(s=>{S.data[col]=s.docs.map(d=>Object.assign(NORM[col](d.data()||{}),{_id:d.id}));S.loaded.add(col);if(!S.firstAnim&&["lancamentos","pedidos","acertos"].every(c=>S.loaded.has(c))){S.firstAnim=true;S.anim=true;}render();},()=>{});

  db.doc("config/whatsapp").onSnapshot(s=>{const d=s.exists&&s.data()||{};S.cfg.whatsapp={numeros:Array.isArray(d.numeros)?d.numeros.filter(x=>x&&typeof x.numero==="string"):[{nome:"Universo Store (WhatsApp Business)",numero:"+55 61 99226-7953",de:"Paloma",uso:"loja"}],modelos:Object.assign({},WA_MODELOS,typeof d.modelos==="object"&&d.modelos?d.modelos:{})};render();},()=>{});
  db.doc("config/shopmix").onSnapshot(s=>{S.cfg.shopmix=s.exists&&s.data()||{};render();},()=>{});
  db.doc("config/chefLib").onSnapshot(s=>{const d=s.exists&&s.data()||{};S.cfg.chefLib={menus:Array.isArray(d.menus)?d.menus:[],receitas:Array.isArray(d.receitas)?d.receitas:[]};render();},()=>{});
  db.doc("config/pix").onSnapshot(s=>{const d=s.exists&&s.data()||{};S.cfg.pix={tipo:str(d.tipo)||"telefone",chave:str(d.chave),nome:str(d.nome),cidade:str(d.cidade)};render();},()=>{});
  db.doc("config/donos").onSnapshot(s=>{const d=s.exists&&s.data()||{};const L=d.lojas&&typeof d.lojas==="object"?d.lojas:{};S.cfg.donos={lojas:Object.fromEntries(Object.entries(L).map(([k,v])=>[str(k),Math.min(100,Math.max(0,Math.round(numv(v,50))))])),rateio:["venda","igual","padrao"].includes(d.rateio)?d.rateio:"venda"};render();},()=>{});
  db.doc("config/site").onSnapshot(s=>{S.cfg.site=s.exists&&s.data()||{};render();},()=>{});

  db.doc("config/org").onSnapshot(s=>{applyOrg(s.exists&&s.data()||{});render();},()=>{});
  db.doc("config/precos").onSnapshot(s=>{const d=s.exists&&s.data()||{};S.cfg.precos={itens:typeof d.itens==="object"&&d.itens?d.itens:{},cmv:numv(d.cmv,30)};render();},()=>{});
  db.doc("config/sync").onSnapshot(s=>{S.cfg.sync=s.exists&&s.data()||{};render();},()=>{});
  db.doc("config/socias").onSnapshot(s=>{const d=s.exists&&s.data()||{};const pc=d.pct||{};S.cfg.socias={pct:{loja:Math.min(100,Math.max(0,numv(pc.loja,50))),chef:Math.min(100,Math.max(0,numv(pc.chef,50)))},regras:typeof d.regras==="object"&&d.regras?d.regras:{},pix:Object.assign({"Paloma":"","Jay Nanes":""},typeof d.pix==="object"&&d.pix?d.pix:{})};render();},()=>{});

  if(S.me.isOwner)sub("solicitacoes");

  // assina os dados só depois de confirmar o acesso
  const wait=setInterval(()=>{if(S.loaded.has("acesso")&&isMember()){clearInterval(wait);startData();}},300);
  render();
})();
