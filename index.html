<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16172b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jay-Loma">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Caixa Jay-Loma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: três espaços com identidade própria — Visão das sócias (neutro), Jay-Loma Lojas (cosmos índigo/ciano), Jay Personal Chef (ametista/dourado, serifada). Barra lateral escura da marca + faixa-herói em cada tela. */
:root{
  --bg:#f5f5f8; --surface:#ffffff; --surface-2:#eef0f5; --line:#e1e3ec; --ink:#16172b; --muted:#646884;
  --accent:#3d3f63; --accent-2:#8a8fb5; --accent-ink:#ffffff; --accent-soft:#e8e9f3;
  --side-1:#16172b; --side-2:#2a2c4a; --side-ink:#f3f3fa; --side-muted:#a9abc7; --side-hl:rgb(255 255 255 / .1);
  --gold:#a66f12; --pos:#127a4b; --pos-bg:#e1f4ea; --neg:#b42330; --neg-bg:#fbe7e9; --warn:#985a00; --warn-bg:#fdf0d8;
  --f-display:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgb(20 20 50 / .05),0 6px 20px rgb(20 20 50 / .05);
}
:root[data-ws="loja"]{--bg:#f3f5fc;--surface-2:#eaeefb;--line:#dde2f3;--ink:#121637;--muted:#5d6488;--accent:#4338ca;--accent-2:#0891b2;--accent-soft:#e6e7fb;--side-1:#0b0d2e;--side-2:#272a7a;--side-muted:#a7acdb}
:root[data-ws="chef"]{--bg:#f8f5f9;--surface-2:#f1ebf4;--line:#e7dcea;--ink:#21142a;--muted:#6f5d77;--accent:#6b2fb3;--accent-2:#b07d2b;--accent-soft:#f0e6f8;--side-1:#1a0f22;--side-2:#4a1f6e;--side-muted:#cdb7d8;--f-display:"Cormorant Garamond","Georgia",serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1018;--surface:#181a26;--surface-2:#222536;--line:#30344a;--ink:#ecedf6;--muted:#a3a7c2;--accent:#b3b7dd;--accent-2:#8a8fb5;--accent-ink:#14152a;--accent-soft:#262a40;--side-1:#0a0b12;--side-2:#1d1f31;--gold:#f0c25a;--pos:#4fd292;--pos-bg:#123224;--neg:#ff7d86;--neg-bg:#3b1a22;--warn:#ffc266;--warn-bg:#3a2a12;--shadow:none;color-scheme:dark}
  :root[data-ws="loja"]:not([data-theme="light"]){--bg:#0b0d1f;--surface:#141733;--surface-2:#1d2145;--line:#2c3164;--ink:#eceefe;--muted:#a3a9d6;--accent:#8f8cff;--accent-2:#38d0e8;--accent-ink:#0b0d2e;--accent-soft:#232764;--side-1:#06071a;--side-2:#1b1d5c}
  :root[data-ws="chef"]:not([data-theme="light"]){--bg:#120b17;--surface:#1c1222;--surface-2:#271a30;--line:#3a2846;--ink:#f6eef9;--muted:#c0aac9;--accent:#c39bf5;--accent-2:#e2b45a;--accent-ink:#1a0f22;--accent-soft:#33204a;--side-1:#0d0711;--side-2:#3a1658}
}
:root[data-theme="dark"]{--bg:#0f1018;--surface:#181a26;--surface-2:#222536;--line:#30344a;--ink:#ecedf6;--muted:#a3a7c2;--accent:#b3b7dd;--accent-2:#8a8fb5;--accent-ink:#14152a;--accent-soft:#262a40;--side-1:#0a0b12;--side-2:#1d1f31;--gold:#f0c25a;--pos:#4fd292;--pos-bg:#123224;--neg:#ff7d86;--neg-bg:#3b1a22;--warn:#ffc266;--warn-bg:#3a2a12;--shadow:none;color-scheme:dark}
:root[data-theme="dark"][data-ws="loja"]{--bg:#0b0d1f;--surface:#141733;--surface-2:#1d2145;--line:#2c3164;--ink:#eceefe;--muted:#a3a9d6;--accent:#8f8cff;--accent-2:#38d0e8;--accent-ink:#0b0d2e;--accent-soft:#232764;--side-1:#06071a;--side-2:#1b1d5c}
:root[data-theme="dark"][data-ws="chef"]{--bg:#120b17;--surface:#1c1222;--surface-2:#271a30;--line:#3a2846;--ink:#f6eef9;--muted:#c0aac9;--accent:#c39bf5;--accent-2:#e2b45a;--accent-ink:#1a0f22;--accent-soft:#33204a;--side-1:#0d0711;--side-2:#3a1658}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;transition:background .25s}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:700}
:root[data-ws="chef"] h1,:root[data-ws="chef"] h2,:root[data-ws="chef"] h3{letter-spacing:0;font-weight:600}
h1{font-size:clamp(24px,3.2vw,34px);line-height:1.1} h2{font-size:19px} h3{font-size:17px}
:root[data-ws="chef"] h2{font-size:22px} :root[data-ws="chef"] h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:0}
.pos{color:var(--pos)} .neg{color:var(--neg)} .gold{color:var(--gold)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:linear-gradient(170deg,var(--side-1) 0%,var(--side-1) 45%,var(--side-2) 130%);color:var(--side-ink);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:grid;align-content:start;gap:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brandcard{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:4px 6px}
.brandcard svg{width:44px;height:44px}
.brandcard b{font-family:var(--f-display);font-size:19px;line-height:1.1;display:block}
:root[data-ws="chef"] .brandcard b{font-size:22px;font-weight:600}
.brandcard span{font-size:12px;color:var(--side-muted)}
.wsw{display:grid;gap:4px;background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .08);border-radius:12px;padding:4px}
.wsw button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;color:var(--side-muted);border-radius:9px;padding:7px 8px;font-size:13.5px;font-weight:600}
.wsw button svg{width:26px;height:26px}
.wsw .short{display:none}
.wsw button:hover{background:var(--side-hl);color:var(--side-ink)}
.wsw button[aria-pressed="true"]{background:rgb(255 255 255 / .14);color:var(--side-ink)}
.side .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);font-weight:700;padding:0 8px}
nav.mods{display:grid;gap:2px}
nav.mods button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:600;color:var(--side-muted)}
nav.mods button:hover{background:var(--side-hl);color:var(--side-ink)}
nav.mods button[aria-current="page"]{background:var(--side-ink);color:var(--side-1)}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--neg);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-family:var(--f-body)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--side-muted);padding:0 8px}
.me img{width:26px;height:26px;border-radius:50%}
.mebox{display:grid;gap:6px}
.sidebtn{display:block;text-align:left;border:1px solid rgb(255 255 255 / .14);background:rgb(255 255 255 / .06);color:var(--side-ink);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;text-decoration:none}
.sidebtn:hover{background:var(--side-hl)}
.sidebtn.ghost{background:transparent;color:var(--side-muted)}
.sidenote{font-size:12px;color:var(--side-muted);padding:0 8px}

.main{padding-block:22px 56px;padding-left:26px;padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;min-width:0;max-width:1320px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;color:var(--side-ink);background:radial-gradient(120% 140% at 100% 0%,var(--side-2) 0%,transparent 60%),linear-gradient(135deg,var(--side-1),var(--side-1));display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:1px solid rgb(255 255 255 / .12);pointer-events:none}
.hero .eyebrow{color:var(--side-muted)}
.hero .ttl{display:grid;gap:4px;position:relative;z-index:1}
.hero .ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.hero .btn{background:var(--side-ink);color:var(--side-1)}
.hero .btn.ghost{background:transparent;color:var(--side-ink);border-color:rgb(255 255 255 / .3)}
.hero .month,.hero .seg2{background:rgb(255 255 255 / .1);border-color:rgb(255 255 255 / .16)}
.hero .month button,.hero .seg2 button{color:var(--side-muted)}
.hero .month button:hover{background:rgb(255 255 255 / .12);color:var(--side-ink)}
.hero .seg2 button[aria-pressed="true"]{background:var(--side-ink);color:var(--side-1)}
:root[data-ws="loja"] .hero{background:radial-gradient(90% 160% at 100% 0%,#3b3fd6 0%,transparent 55%),radial-gradient(60% 120% at 70% 120%,#0e7490 0%,transparent 60%),linear-gradient(135deg,#0b0d2e,#141756)}
:root[data-ws="chef"] .hero{background:radial-gradient(90% 160% at 100% 0%,#6b2fb3 0%,transparent 55%),radial-gradient(50% 90% at 85% 120%,rgb(176 125 43 / .55) 0%,transparent 60%),linear-gradient(135deg,#1a0f22,#2c1640)}
:root[data-ws="chef"] .hero::after{border-color:rgb(226 180 90 / .35)}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.2px 1.2px at 12% 30%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 38% 70%,#fff7 50%,transparent 51%),radial-gradient(1.4px 1.4px at 62% 22%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 84% 64%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 26% 88%,#fff6 50%,transparent 51%)}

.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;font-size:18px;color:var(--muted)}
.month span{min-width:138px;text-align:center;font-weight:700;font-size:14px}
.seg2{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);font-size:13.5px}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.notice[data-kind="err"]{background:var(--neg-bg);border-color:transparent;color:var(--neg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px rgb(0 0 0 / .2);background:var(--surface)}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:grid;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-soft)}
.kpi .v{font-family:var(--f-num);font-size:clamp(17px,2.2vw,23px);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));border-color:transparent;color:var(--accent-ink)}
.kpi.hl::before{display:none}
.kpi.hl .eyebrow,.kpi.hl .s{color:inherit;opacity:.85}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
tr.low td{background:var(--warn-bg)}

.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.link{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 7px;border-radius:7px;white-space:nowrap;font-weight:600}
.link:hover{background:var(--surface-2);color:var(--ink)}
.link.armed{background:var(--neg);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.e,.pill.ok{background:var(--pos-bg);color:var(--pos)}
.pill.s,.pill.bad{background:var(--neg-bg);color:var(--neg)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select,.filters input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:14px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

form.f,.f{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:8px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;gap:6px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:var(--ink)}
.formmsg{font-size:13px;min-height:1.2em;margin:0}

.bars{display:grid;gap:12px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .track{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:5px}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600}
.chip button{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.partner-box{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.partner{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.due{display:grid;justify-items:end}
.due .num{font-size:17px}
.sub{font-size:12.5px;color:var(--muted)}

.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.alert .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 4px var(--surface-2)}
.alert[data-lv="alta"] .dot{background:var(--neg)} .alert[data-lv="media"] .dot{background:var(--warn)} .alert[data-lv="info"] .dot{background:var(--accent)}
.alert b{display:block;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag.loja i{background:#4f46e5} .tag.chef i{background:#8b3fd6} .tag.geral i{background:#8a8fb5}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.card .top2{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card .meta{font-size:13px;color:var(--muted)}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.card img.cr{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--surface-2);max-width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-family:var(--f-num);font-size:14px;color:var(--ink);font-weight:500}

/* Guias didáticos */
.guide{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.guide>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700}
.guide>summary::-webkit-details-marker{display:none}
.guide>summary .q{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:13px;flex:0 0 auto}
.guide>summary .chev{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.guide[open]>summary .chev::after{content:"Recolher"} .guide:not([open])>summary .chev::after{content:"Ver explicação"}
.guide .gb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:0 16px 16px}
.guide .gb p{margin:0;font-size:14.5px;line-height:1.55}

// ---------- conexão
(async()=>{
  const [db,user,assets,sample,downloads]=await Promise.all(["db","user","assets","sample","downloads"].map(n=>claude.use(n)));
  if(!db){$("bootMsg").textContent="Não deu para conectar ao banco de dados. Recarregue a página.";return;}
  Object.assign(S,{db,user,assets,sample,downloads});
  if(user){const me=await user.me();S.me={id:me.id,isOwner:me.isOwner,name:me.name,avatar:me.avatarUrl,email:me.email||""};const cw=await user.can("data.write");if(cw===false)S.canWrite=false;}
  const sub=(col)=>db.collection(col).onSnapshot(s=>{S.data[col]=s.docs.map(d=>Object.assign(NORM[col](d.data()||{}),{_id:d.id}));S.loaded.add(col);render();},()=>{});
  db.doc("acesso/membros").onSnapshot(s=>{const d=s.exists&&s.data();S.membros=Array.isArray(d&&d.ids)?d.ids.filter(x=>typeof x==="string"):[];S.membrosEmails=Array.isArray(d&&d.emails)?d.emails.map(x=>String(x).toLowerCase()):[];S.loaded.add("acesso");render();},()=>{S.membros=[];S.loaded.add("acesso");render();});
